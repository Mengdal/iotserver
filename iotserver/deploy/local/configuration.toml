# 嵌入式部署配置模板（ARM64）
# 目录：/opt/iotserver 程序、/var/lib/iotserver 数据、/var/log/iotserver 日志、/etc/iotserver 配置

# ========== 运行日志 ==========
[Writable]
LogLevel = 'INFO'
LogPath = '/var/log/iotserver/iotserver-core.log'

# ========== 服务端口 ==========
[Service]
Host = '0.0.0.0'
ServerBindAddr = ''
Port = 58081
Timeout = 45000
# eKuiper 回调地址（本机部署直接回调本机）
CallbackUrl = 'http://127.0.0.1:58081'
CallbackToken = ''

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

# ========== 前端 ==========
[WebUI]
BuildPath = '/opt/iotserver/ui'

# ========== 数据库 ==========
[Databases]
[Databases.Metadata]
Type = 'sqlite'
DataSource = '/var/lib/iotserver/core.db?_timeout=5000'

[Databases.Data]
# 嵌入式部署使用外部 iotp 时序库
Type = 'iotp'
BaseURL = 'http://124.223.204.174:8080'
# Token 不写入模板；复制本文件为 configuration.local.toml 后填写
Token = ''
Name = 'iotserver'
Timeout = 10000

# ========== 消息与外部服务 ==========
[MessageQueue]
Protocol = 'tcp'
Host = '127.0.0.1'
Port = 58090
PublishTopicPrefix = 'eventbus/in'

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = '127.0.0.1'
Port = 9081

[Integrations]
[Integrations.EdgeIngest]
# 参考系统上行 broker；留空回落到 MessageQueue
Broker = ''
# 控制通道；留空回落到 Broker
ControlBroker = ''
Username = ''
Password = ''
# 订阅刷新间隔（秒），<=0 用默认值 60
ResyncIntervalSec = 60

# ========== 部署与插件 ==========
[Deployment]
# server=Docker 驱动；embedded=本机插件
Mode = 'embedded'

[Plugins]
Root = '/opt/iotserver/plugins'
DataDir = '/var/lib/iotserver/plugin-data'

[CollectEngine]
# iotpGW .so 驱动安装目录
DriverDir = '/opt/iotpgw/drivers'
BackupDir = '/var/lib/iotserver/driver-backups'
# none=只替换文件；command=执行重启命令；api=预留远程接口
ReloadMode = 'command'
ReloadCommand = '/etc/init.d/S93iotserver-iotpgw restart'
# iotpGW 期望的驱动 ABI，留空不校验
DriverABI = ''

# ========== 系统组件日志 ==========
# 默认按部署形态自动选择；需要覆盖时取消注释
# [[ComponentLogs.Sources]]
# Id = 'sys-mosquitto'
# Name = 'Mosquitto'
# Path = '/var/log/iotserver/mosquitto.log'

# ========== 调试 ==========
[Pprof]
# 性能诊断端点 /debug/pprof（需 x-token + system:debug:pprof 权限）
Enabled = false
