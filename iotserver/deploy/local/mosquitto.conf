# 本地部署 Mosquitto 配置
#
# 内部消息总线：只监听回环地址，平台与 eKuiper 使用，不需要账号。
# 网关接入：如需局域网设备直连，再启用下面的 1883 监听并配置密码文件/ACL。

# 运行用户：init/systemd 脚本已用 iotserver 用户启动，通常在非 root 下运行，
# 此指令不生效；如果是 root 直接手动启动，取消下一行注释。
# user iotserver

per_listener_settings true

persistence true
persistence_location /var/lib/iotserver/mosquitto/
autosave_interval 60

log_dest file /var/log/iotserver/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# 平台内部总线
listener 58090 127.0.0.1
allow_anonymous true

# 网关/外部客户端接入（按需启用）
# listener 1883 0.0.0.0
# allow_anonymous false
# password_file /etc/iotserver/mosquitto.passwd
# acl_file /etc/iotserver/mosquitto.acl
