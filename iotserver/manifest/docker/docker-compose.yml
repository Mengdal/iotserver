networks:
  iotserver:
    driver: bridge
services:
  mqtt-broker:
    image: registry.cn-shanghai.aliyuncs.com/winc-link/mqtt-broker:2.6
    container_name: mqtt-broker
    hostname: mqtt-broker
    restart: always
    ports:
      - "58090:58090"
    volumes:
      # 日志目录与 core 共享：broker 把日志写在容器内 /logs/mqtt-broker，
      # core 通过下方 ./:/var/bin/iotserver 挂载读取同名宿主机目录。
      # 镜像默认单文件输出；由 logrotate 服务按大小轮转。
      - ./mqtt-broker/log:/logs/mqtt-broker
    networks:
      - iotserver
  logrotate:
    # broker 不支持重新打开日志文件，轮转后由该服务重启容器。
    build:
      context: ./logrotate
    image: ${LOGROTATE_IMAGE:-iotserver-logrotate:1.0}
    container_name: iotserver-logrotate
    restart: always
    depends_on:
      - mqtt-broker
    volumes:
      - ./mqtt-broker/log:/logs/mqtt-broker
      - /var/run/docker.sock:/var/run/docker.sock
  ekuiper:
    # 内置 Kafka / InfluxDB sink 插件；修改插件后需重新 build
    build:
      context: ./ekuiper
    image: ${EKUIPER_IMAGE:-iotserver-ekuiper:2.4.2}
    ports:
      - "127.0.0.1:9081:9081"
      # 规则试运行（/ruletest）的 SSE 输出端口；规则编辑器“调试规则”使用
      - "127.0.0.1:10081:10081"
    container_name: ekuiper
    hostname: ekuiper
    restart: always
    user: root
    volumes:
      - ./kuiper/data:/kuiper/data
      - ./kuiper/log:/kuiper/log
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt-broker:58090"
      KUIPER__BASIC__CONSOLELOG: "true"
      KUIPER__BASIC__IGNORECASE: "false"
      # eKuiper 2.4 默认禁止规则访问私网；HTTP 数据资源通常指向内网/本机服务，需显式放开。
      # 如部署环境只允许推送公网地址，可改回 "false"。
      KUIPER__BASIC__ENABLEPRIVATENET: "true"
    networks:
      - iotserver
  ekuiper-manager:
    image: emqx/ekuiper-manager:1.9.5
    container_name: ekuiper-manager
    restart: always
    ports:
      - "9082:9082"
    environment:
      DEFAULT_EKUIPER_ENDPOINT: "http://ekuiper:9081"
    networks:
      - iotserver
  iotserver-core:
    # 镜像来自本仓库构建：make ui && make docker（默认 iotserver-core:v1.0）
    # 需要换成自己的仓库/版本时，用环境变量覆盖：IOTSERVER_IMAGE=your-registry/iotserver-core:v1.2 docker compose up -d
    image: ${IOTSERVER_IMAGE:-iotserver-core:v1.0}
    container_name: iotserver-core
    restart: always
    hostname: iotserver-core
    ports:
      - "3000:3000"
      - "58081:58081"
      - "57081:57081"
    depends_on:
      - ekuiper
      - mqtt-broker
    volumes:
      - ./:/var/bin/iotserver
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主机上的 iotpGW（非容器运行时）日志目录，只读挂载给 core 读取
      - /var/log/iotserver:/var/log/iotserver:ro
      - ./config/configuration.toml:/etc/iotserver-core/configuration.toml
    networks:
      - iotserver
