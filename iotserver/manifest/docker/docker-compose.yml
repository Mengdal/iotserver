networks:
  iotserver:
    driver: bridge
services:
  mqtt-broker:
    image: registry.cn-shanghai.aliyuncs.com/winc-link/mqtt-broker:2.6
    container_name: mqtt-broker
    hostname: mqtt-broker
    restart: always
    ports:
      - "58090:58090"
    networks:
      - iotserver
  ekuiper:
    image: lfedge/ekuiper:2.4.2-slim
    ports:
      - "127.0.0.1:9081:9081"
    container_name: ekuiper
    hostname: ekuiper
    restart: always
    user: root
    volumes:
      - ./kuiper/data:/kuiper/data
      - ./kuiper/log:/kuiper/log
    environment:
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://mqtt-broker:58090"
      KUIPER__BASIC__CONSOLELOG: "true"
      KUIPER__BASIC__IGNORECASE: "false"
    networks:
      - iotserver
  ekuiper-manager:
    image: emqx/ekuiper-manager:1.9.5
    container_name: ekuiper-manager
    restart: always
    ports:
      - "9082:9082"
    environment:
      DEFAULT_EKUIPER_ENDPOINT: "http://ekuiper:9081"
    networks:
      - iotserver
  iotserver-core:
    # 镜像来自本仓库构建：make ui && make docker（默认 iotserver-core:v1.0）
    # 需要换成自己的仓库/版本时，用环境变量覆盖：IOTSERVER_IMAGE=your-registry/iotserver-core:v1.2 docker compose up -d
    image: ${IOTSERVER_IMAGE:-iotserver-core:v1.0}
    container_name: iotserver-core
    restart: always
    hostname: iotserver-core
    ports:
      - "3000:3000"
      - "58081:58081"
      - "57081:57081"
    depends_on:
      - ekuiper
      - mqtt-broker
    volumes:
      - ./:/var/bin/iotserver
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/configuration.toml:/etc/iotserver-core/configuration.toml
    networks:
      - iotserver
