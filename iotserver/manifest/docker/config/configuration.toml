# ========== 运行日志 ==========
[Writable]
LogLevel = 'INFO'
LogPath = 'iotserver/logs/iotserver-core.log'

# ========== 服务端口 ==========
[Service]
Host = '0.0.0.0'
ServerBindAddr = ''
Port = 58081
Timeout = 45000
# eKuiper 回调地址（容器内使用 compose 服务名）
CallbackUrl = 'http://iotserver-core:58081'
# 回调密钥，留空不校验；生产建议设置为随机串
CallbackToken = ''

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

# ========== 前端 ==========
[WebUI]
BuildPath = './cmd/iotserver-ui/build'

# ========== 数据库 ==========
[Databases]
[Databases.Metadata]
Type = 'sqlite'
DataSource = 'iotserver/db-data/core-data/core.db?_timeout=5000'

[Databases.Data]
# 路径相对容器工作目录 /var/bin/，即宿主机 manifest/docker/db-data/
# duckdb=单文件列存；iotp=外部时序库（填写下方 BaseURL/Token/Name/Timeout）
Type = 'duckdb'
DataSource = 'iotserver/db-data/duckdb/core-data.duckdb'
# iotp 连接参数（Type='iotp' 时使用）
# BaseURL = 'http://host:8080'
# Token = ''
# Name = 'iotserver'
# Timeout = 10000  # 毫秒

# ========== 消息与外部服务 ==========
[MessageQueue]
Protocol = 'tcp'
Host = 'mqtt-broker'
Port = 58090
PublishTopicPrefix = 'eventbus/in'

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = 'ekuiper'
Port = 9081

# ========== 调试 ==========
[Pprof]
# 性能诊断端点 /debug/pprof（需 x-token + system:debug:pprof 权限）
Enabled = false
