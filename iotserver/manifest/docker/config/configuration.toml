[Writable]
LogLevel = 'INFO'
LogPath = 'iotserver/logs/iotserver-core.log'

[Service]
Host = '0.0.0.0'
ServerBindAddr = '' # Leave blank so default to Host value unless different value is needed.
Port = 58081
Protocol = 'http'
Timeout = 45000
# eKuiper 规则动作回调平台的基地址：容器内用 compose 服务名（默认值即是它，可省略）
CallbackUrl = 'http://iotserver-core:58081'
# 回调共享密钥：非空时 eKuiper 回调必须带 X-Callback-Token（规则动作会自动带上）。
# 生产环境建议设置成随机串，例如 openssl rand -hex 16
CallbackToken = ''

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = 'ekuiper'
Port = 9081

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[Databases]
[Databases.Metadata]
[Databases.Metadata.Primary]
Type = 'sqlite'
DataSource = 'iotserver/db-data/core-data/core.db?_timeout=5000'


[Databases.Data]
[Databases.Data.Primary]
# 数据层：DuckDB 单文件列存。
# 路径相对容器工作目录 /var/bin/，即宿主机 manifest/docker/db-data/（compose 已挂载，重建容器不丢数据）。
Type = 'duckdb'
DataSource = 'iotserver/db-data/duckdb/core-data.duckdb'

# 调试端点 /debug/pprof：默认关闭（暴露协程栈/堆内存）。开启后需 x-token + system:debug:pprof 权限。
[Pprof]
Enabled = false

[MessageQueue]
Protocol = 'tcp'
Host = 'mqtt-broker'
Port = 58090
Type = 'mqtt'
PublishTopicPrefix = 'eventbus/in'

# 画布看板（布局 + 文本组件）登记文件（相对容器工作目录 /var/bin）
[Viz]
BoardsFile = '.viz-boards.json'

# 多租户隔离（多租户：一个实例服务多个租户，按 tenant_id 行级隔离）
# Enforce=false（迁移期）：未带租户上下文的调用不过滤，仅打告警日志；
# Enforce=true（上线）：租户表查询缺少租户上下文时返回空集，写入报错。
[Tenant]
Enforce = false
