[Writable]
LogLevel = 'INFO'
LogPath = 'iotserver/logs/iotserver-core.log'

[Service]
Host = '0.0.0.0'
ServerBindAddr = '' # Leave blank so default to Host value unless different value is needed.
Port = 58081
Timeout = 45000
# eKuiper 规则回调平台（告警上报 / 场景触发）使用的基地址。
# docker-compose 部署用服务名 http://iotserver-core:58081；本地直接跑服务时填容器可达的宿主机地址。
CallbackUrl = 'http://host.docker.internal:58081'
CallbackToken = ''  # 留空=不校验回调密钥；生产建议设置为随机串

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = '127.0.0.1'
Port = 9081

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[Databases]
[Databases.Metadata]
Type = 'sqlite'
DataSource = 'manifest/docker/db-data/core-data/core.db?_timeout=5000'

[Databases.Data]
# 单文件列存：一个 DuckDB 数据库文件，事务不产生 Parquet 文件，
# 因此不需要分区 / 合并小文件 / 过期快照那一整套文件生命周期管理。
# 改为 'iotp' 时数据写入外部 iotp 时序库（认证参数见 [Integrations.Iotp]），DataSource 不再使用；
# iotp 模式不支持按设备删数据 / 保留期清理 / 在线导出，消息数按宽表行统计。
Type = 'duckdb'
DataSource = 'manifest/docker/db-data/duckdb/core-data.duckdb'

[MessageQueue]
Protocol = 'tcp'
Host = '127.0.0.1'
Port = 58090
PublishTopicPrefix = 'eventbus/in'

# 参考系统（iotddc / things）接入所用的 broker。
#
# 为什么不复用上面那段：MessageQueue 同时还跑着平台的**内部消息总线**
# （PublishTopicPrefix = eventbus/in，规则引擎/事件链路都走它），而参考系统的上行
# 数据在**另一个 broker** 上。把 MessageQueue.Host 直接改过去会连带搬走内部总线。
#
# Broker 留空则回落到 MessageQueue 的地址（既有部署行为不变）。
# 本文件在仓库里：生产地址与凭据请按环境填写，提交前记得清空。
[Integrations]
[Integrations.EdgeIngest]
Broker = ''
# 控制通道 broker（重启/标签树/属性写）；留空回落到 Broker
# ControlBroker = 'tcp://host:1883'
Username = ''
Password = ''
# 订阅刷新间隔（秒）：界面上增删网关后自动重订阅，无需重启服务；<=0 用默认值 60
ResyncIntervalSec = 60

# iotp 时序库元数据同步：产品/物模型 → 库表字段，设备 → 设备实例。
# 只同步元数据，不负责时序数据写入；Enabled=false 时完全跳过。
# 采集引擎（IOTP Gateway API）：采集配置「下发」时把通道/设备/点位同步过去。
[Integrations.CollectEngine]
Enabled = false
BaseURL = ''
TimeoutSec = 10

# iotp 时序库接入：元数据同步（iotpsync）与数据后端（Type='iotp'）共用。
[Integrations.Iotp]
Enabled = false
BaseURL = ''
Token = ''
Database = 'iotserver'
TimeoutSec = 10

# 调试端点（/debug/pprof）：默认关闭。
# 开启后需携带 x-token 且账号具备 system:debug:pprof 权限（超级管理员直通）。
[Pprof]
Enabled = false

# 多租户隔离（多租户：一个实例服务多个租户，按 tenant_id 行级隔离）
# Enforce=false（迁移期）：未带租户上下文的调用不过滤，仅打告警日志；
# Enforce=true（上线）：租户表查询缺少租户上下文时返回空集，写入报错。
[Tenant]
Enforce = false
