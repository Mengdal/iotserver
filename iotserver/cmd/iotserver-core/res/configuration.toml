# ========== 运行日志 ==========
[Writable]
LogLevel = 'INFO'
LogPath = 'iotserver/logs/iotserver-core.log'

# ========== 服务端口 ==========
[Service]
Host = '0.0.0.0'
ServerBindAddr = ''
Port = 58081
Timeout = 45000
# eKuiper 回调平台的地址（Docker 填服务名，本机运行填宿主机地址）
CallbackUrl = 'http://host.docker.internal:58081'
# 回调密钥，留空不校验；生产建议设置为随机串
CallbackToken = ''

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

# ========== 前端 ==========
[WebUI]
BuildPath = './cmd/iotserver-ui/build'

# ========== 数据库 ==========
[Databases]
[Databases.Metadata]
Type = 'sqlite'
DataSource = 'manifest/docker/db-data/core-data/core.db?_timeout=5000'

[Databases.Data]
# duckdb=单文件列存；iotp=外部时序库（填写下方 BaseURL/Token/Name/Timeout）
Type = 'duckdb'
DataSource = 'manifest/docker/db-data/duckdb/core-data.duckdb'
# iotp 连接参数（Type='iotp' 时使用；只填 BaseURL 也会启用元数据同步/实时值读取）
# BaseURL = 'http://host:8080'
# Token = ''
# Name = 'iotserver'
# Timeout = 10000  # 毫秒

# ========== 消息与外部服务 ==========
[MessageQueue]
Protocol = 'tcp'
Host = '127.0.0.1'
Port = 58090
PublishTopicPrefix = 'eventbus/in'

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = '127.0.0.1'
Port = 9081

[Integrations]
[Integrations.EdgeIngest]
# 参考系统（iotddc/things）上行 broker；留空回落到 MessageQueue
Broker = ''
# 控制通道（重启/标签树/属性写）；留空回落到 Broker
# ControlBroker = 'tcp://host:1883'
Username = ''
Password = ''
# 订阅刷新间隔（秒），<=0 用默认值 60
ResyncIntervalSec = 60

# ========== 部署与插件 ==========
[Deployment]
# server=Docker 驱动；embedded=本机插件
Mode = 'server'

[Plugins]
# 原生插件：Root 为版本目录，DataDir 为实例配置/日志/PID
Root = 'data/plugins'
DataDir = 'data/plugin-data'

# ========== 调试 ==========
[Pprof]
# 性能诊断端点 /debug/pprof（需 x-token + system:debug:pprof 权限）
Enabled = false
