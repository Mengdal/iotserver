[Writable]
LogLevel = 'INFO'
LogPath = 'iotserver/logs/iotserver-core.log'

[Service]
Host = '0.0.0.0'
ServerBindAddr = '' # Leave blank so default to Host value unless different value is needed.
Port = 58081
Protocol = 'http'
Timeout = 45000
# eKuiper 规则回调平台（告警上报 / 场景触发）使用的基地址。
# docker-compose 部署用服务名 http://iotserver-core:58081；本地直接跑服务时填容器可达的宿主机地址。
CallbackUrl = 'http://host.docker.internal:58081'
CallbackToken = ''  # 留空=不校验回调密钥；生产建议设置为随机串

[RpcServer]
Address = '0.0.0.0:57081'
UseTLS = false
CertFile = ''
KeyFile = ''

[Clients]
[Clients.Ekuiper]
Protocol = 'http'
Host = '127.0.0.1'
Port = 9081

[WebServer]
Host = '0.0.0.0'
Port = 3000
Timeout = 120

[Databases]
[Databases.Metadata]
[Databases.Metadata.Primary]
Type = 'sqlite'
DataSource = 'manifest/docker/db-data/core-data/core.db?_timeout=5000'
#Type = 'mysql'
#Dsn = 'root:123456@tcp(127.0.0.1:3306)/iotserver?charset=utf8mb4&parseTime=True&loc=Local'

[Databases.Data]
[Databases.Data.Primary]
# 单文件列存（默认）：一个 DuckDB 数据库文件，事务不产生 Parquet 文件，
# 因此不需要分区 / 合并小文件 / 过期快照那一整套文件生命周期管理。
Type = 'duckdb'
DataSource = 'manifest/docker/db-data/duckdb/core-data.duckdb'
# 湖仓形态（可选）：catalog + Parquet 数据目录，需要 ducklake 扩展。
#Type = 'ducklake'
#DataSource = 'manifest/docker/db-data/ducklake/catalog.db'  # 元数据（catalog）
#Dsn = 'manifest/docker/db-data/ducklake/data'              # 数据文件（Parquet）目录
# 容器里这份数据目录写成 iotserver/db-data/ducklake/data（工作目录 /var/bin），
# 与本地的 manifest/docker/db-data/ducklake/data 是**同一个物理目录**但字符串不同。
# ducklake 会把 DATA_PATH 记进 catalog 并校验字符串，所以这里允许用配置值覆盖它。
#OverrideDataPath = true

[MessageQueue]
Protocol = 'tcp'
Host = '127.0.0.1'
Port = 58090
Type = 'mqtt'
PublishTopicPrefix = 'eventbus/in'

# 调试端点（/debug/pprof）：默认关闭。
# 开启后需携带 x-token 且账号具备 system:debug:pprof 权限（超级管理员直通）。
[Pprof]
Enabled = false

# 画布看板（布局 + 文本组件）
# 看板登记文件：看板名称/图标/首页标记，以及每个组件的位置、类型与文本
[Viz]
BoardsFile = '.viz-boards.json'

# 多租户隔离（ROBX：一个实例服务多个租户，按 tenant_id 行级隔离）
# Enforce=false（迁移期）：未带租户上下文的调用不过滤，仅打告警日志；
# Enforce=true（上线）：租户表查询缺少租户上下文时返回空集，写入报错。
[Tenant]
Enforce = false
