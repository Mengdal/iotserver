        type: string
    type: object
  dtos.DataResourceInfo:
    properties:
      name:
        type: string
      option:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  dtos.DataResourceVerifyResponse:
    properties:
      health:
        type: boolean
      message:
        type: string
    type: object
  dtos.DeviceAuthInfoResponse:
    properties:
      clientId:
        type: string
      mqttHostUrl:
        type: string
      password:
        type: string
      port:
        type: integer
      username:
        type: string
    type: object
  dtos.DeviceInfoResponse:
    properties:
      cloud_device_id:
        type: string
      cloud_instance_id:
        type: string
      cloud_product_id:
        type: string
      create_at:
        type: integer
      description:
        type: string
      device_service_name:
        type: string
      id:
        type: string
      last_online_time:
        type: integer
      last_sync_time:
        type: integer
      name:
        type: string
      platform:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      secret:
        type: string
      status:
        type: string
    type: object
  dtos.DeviceLibraryAddRequest:
    properties:
      container_name:
        type: string
      description:
        type: string
      docker_config_id:
        type: string
      docker_repo_name:
        type: string
      id:
        type: string
      language:
        description: 代码语言
        type: string
      name:
        type: string
      protocol:
        type: string
      support_version:
        properties:
          config_json:
            type: string
          docker_params:
            type: string
          docker_params_switch:
            type: boolean
          expert_mode:
            type: boolean
          expert_mode_content:
            type: string
          is_default:
            type: boolean
        type: object
      version:
        type: string
    required:
    - container_name
    - docker_config_id
    - docker_repo_name
    - name
    - version
    type: object
  dtos.DeviceSearchQueryResponse:
    properties:
      cloud_instance_id:
        type: string
      cloud_product_id:
        type: string
      created:
        type: integer
      description:
        type: string
      drive_instance_id:
        type: string
      driver_service_name:
        type: string
      id:
        type: string
      last_online_time:
        type: integer
      last_sync_time:
        type: integer
      name:
        type: string
      platform:
        type: string
      product_id:
        type: string
      product_name:
        type: string
      status:
        type: string
    type: object
  dtos.DeviceServiceUpdateRequest:
    properties:
      config:
        additionalProperties: true
        type: object
      deviceLibraryId:
        type: string
      docker_params:
        type: string
      docker_params_switch:
        type: boolean
      expertMode:
        type: boolean
      expertModeContent:
        type: string
      id:
        type: string
      name:
        type: string
      platform:
        type: string
    required:
    - id
    type: object
  dtos.DockerConfigAddRequest:
    properties:
      account:
        description: 账户
        type: string
      address:
        description: 仓库地址 true
        type: string
      id:
        type: string
      password:
        description: 密码
        type: string
    required:
    - address
    type: object
  dtos.DockerConfigUpdateRequest:
    properties:
      account:
        type: string
      address:
        type: string
      id:
        type: string
      password:
        type: string
    required:
    - id
    type: object
  dtos.InitPasswordRequest:
    properties:
      newPassword:
        type: string
    required:
    - newPassword
    type: object
  dtos.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dtos.Notify:
    properties:
      end_effect_time:
        description: 生效结束时间
        type: string
      name:
        description: 告警方式
        type: string
      option:
        additionalProperties:
          type: string
        type: object
      start_effect_time:
        description: 生效开始时间
        type: string
    type: object
  dtos.ProductAddRequest:
    properties:
      category_template_id:
        description: 如果是自定义 id固定传递"1"
        type: string
      data_format:
        description: 数据类型
        type: string
      description:
        description: 描述
        type: string
      factory:
        description: 厂家
        type: string
      key:
        description: Platform           string `json:"platform"`
        type: string
      name:
        description: 产品名字
        type: string
      net_type:
        description: 联网模式
        type: string
      node_type:
        description: 节点类型
        type: string
      protocol:
        description: 协议
        type: string
    type: object
  dtos.ProductSearchByIdResponse:
    properties:
      actions: {}
      cloud_instance_id:
        type: string
      cloud_product_id:
        type: string
      created_at:
        type: integer
      data_format:
        type: string
      description:
        type: string
      events: {}
      factory:
        type: string
      id:
        type: string
      key:
        type: string
      last_sync_time:
        type: integer
      name:
        type: string
      net_type:
        type: string
      node_type:
        type: string
      platform:
        type: string
      properties: {}
      protocol:
        type: string
      status:
        type: string
    type: object
  dtos.ProductSearchQueryResponse:
    properties:
      category_name:
        type: string
      created_at:
        type: integer
      id:
        type: string
      key:
        type: string
      name:
        type: string
      node_type:
        type: string
      platform:
        type: string
      product_id:
        type: string
      status:
        type: string
    type: object
  dtos.RuleEngineSearchQueryResponse:
    properties:
      created:
        type: integer
      data_resource_id:
        description: DataResourceId 供编辑表单回填资源下拉（旧 swagger 未含，属兼容性补充）
        type: string
      dataResource:
        $ref: '#/definitions/dtos.DataResourceInfo'
        description: DataResource 列表「转发方式」列直接读 dataResource.type，必须是对象（不能为 null）
      description:
        type: string
      filter:
        $ref: '#/definitions/models.RuleEngineFilter'
      id:
        type: string
      modified:
        type: integer
      name:
        type: string
      resource_type:
        type: string
      status:
        type: string
    type: object
  dtos.SolutionApplyRequest:
    properties:
      createAlarmRules:
        description: CreateAlarmRules 是否按模板预设创建告警规则（默认 true）
        type: boolean
      deptId:
        description: DeptId 可选：把生成的设备挂到某个组织节点
        type: string
      deviceCount:
        description: DeviceCount >0 时同时创建对应数量的设备（名称 = 产品名-序号）
        type: integer
      productName:
        description: ProductName 生成的产品名称（为空则用模板名称）
        type: string
    type: object
  dtos.SolutionApplyResponse:
    properties:
      alarmRuleIds:
        items:
          type: string
        type: array
      deviceIds:
        items:
          type: string
        type: array
      productId:
        type: string
      productName:
        type: string
      skipped:
        items:
          type: string
        type: array
    type: object
  dtos.SolutionResponse:
    properties:
      alarmRulesJson:
        type: string
      builtIn:
        type: boolean
      dashboardJson:
        type: string
      description:
        type: string
      descriptionEn:
        type: string
      icon:
        type: string
      industry:
        type: string
      key:
        type: string
      metricsJson:
        type: string
      name:
        type: string
      nameEn:
        type: string
      thingModelJson:
        type: string
      version:
        type: integer
    type: object
  dtos.SolutionThingModelItemRequest:
    properties:
      identifier:
        type: string
      item:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  dtos.SubRule:
    properties:
      device_id:
        type: string
      option:
        additionalProperties:
          type: string
        type: object
      product_id:
        type: string
      trigger:
        type: string
    type: object
  dtos.ThingModelActions:
    properties:
      call_type:
        type: string
      input_param:
        items:
          $ref: '#/definitions/dtos.ThingModelEventAction'
        type: array
      output_param:
        items:
          $ref: '#/definitions/dtos.ThingModelEventAction'
        type: array
    type: object
  dtos.ThingModelAddOrUpdateReq:
    properties:
      action:
        $ref: '#/definitions/dtos.ThingModelActions'
      code:
        type: string
      description:
        type: string
      event:
        $ref: '#/definitions/dtos.ThingModelEvents'
      id:
        type: string
      name:
        description: ModelName      string                `json:"model_name"`
        type: string
      product_id:
        type: string
      property:
        $ref: '#/definitions/dtos.ThingModelProperties'
      tag:
        type: string
      thing_model_type:
        type: string
    type: object
  dtos.ThingModelDataResponse:
    properties:
      access_mode:
        type: string
      code:
        type: string
      data_type:
        type: string
      name:
        type: string
      time:
        type: integer
      unit:
        type: string
      value: {}
    type: object
  dtos.ThingModelDeleteReq:
    properties:
      thing_model_id:
        type: string
      thing_model_type:
        type: string
    type: object
  dtos.ThingModelEventAction:
    properties:
      code:
        type: string
      name:
        type: string
      specs: {}
      type:
        type: string
    type: object
  dtos.ThingModelEventDataResponse:
    properties:
      event_code:
        type: string
      event_type:
        type: string
      name:
        type: string
      output_data:
        additionalProperties: true
        type: object
      report_time:
        type: integer
    type: object
  dtos.ThingModelEvents:
    properties:
      event_type:
        type: string
      output_param:
        items:
          $ref: '#/definitions/dtos.ThingModelEventAction'
        type: array
    type: object
  dtos.ThingModelProperties:
    properties:
      access_model:
        type: string
      require:
        type: boolean
      specs: {}
      type:
        type: string
    type: object
  dtos.ThingModelServiceDataResponse:
    properties:
      code:
        type: string
      input_data:
        additionalProperties: true
        type: object
      output_data:
        additionalProperties: true
        type: object
      report_time:
        type: integer
      service_name:
        type: string
    type: object
  dtos.ThingModelTemplateResponse:
    properties:
      actions: {}
      category_key:
        type: string
      category_name:
        description: 品类名称
        type: string
      category_name_en:
        type: string
      events: {}
      id:
        type: string
      properties:
        description: models.Properties
      thing_model_json:
        type: string
    type: object
  dtos.UnitResponse:
    properties:
      id:
        type: string
      symbol:
        type: string
      unit_name:
        type: string
    type: object
  dtos.UpdatePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    required:
    - currentPassword
    - newPassword
    type: object
  httphelper.CommonResponse:
    properties:
      errorCode:
        description: 错误码
        type: integer
      errorMsg:
        description: 错误信息
        type: string
      result:
        description: 返回结果
        type: object
      success:
        description: 接口是否成功
        type: boolean
      successMsg:
        description: 成功信息
        type: string
    type: object
  httphelper.ResPageResult:
    properties:
      list: {}
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  models.RuleEngineFilter:
    properties:
      condition:
        type: string
      message_source:
        type: string
      product_id:
        type: string
      select_name:
        type: string
      sql:
        type: string
    type: object
info:
  contact:
    name: API Support
  description: Swagger API for Golang Project iotserver.
  termsOfService: http://swagger.io/terms/
  title: iotserver 物联网平台 API
  version: "1.0"
paths:
  /api/v1/alert:
    post:
      parameters:
      - in: query
        name: content
        type: string
      - in: query
        name: device_id
        type: string
      - in: query
        name: rule_id
        type: string
      - description: 触发时间
        in: query
        name: trigger_time
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 告警列表
      tags:
      - 告警中心
  /api/v1/alert-ignore/:ruleId:
    put:
      produces:
      - application/json
      responses: {}
      summary: 忽略告警
      tags:
      - 告警中心
  /api/v1/alert-list:
    get:
      parameters:
      - in: query
        name: alertLevel
        type: string
      - in: query
        name: id
        type: string
      - in: query
        name: ids
        type: string
      - in: query
        name: isAll
        type: boolean
      - in: query
        name: likeId
        type: string
      - in: query
        name: name
        type: string
      - in: query
        name: nameLike
        type: string
      - in: query
        name: orderBy
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - in: query
        name: status
        type: string
      - in: query
        name: triggerEndTime
        type: integer
      - in: query
        name: triggerStartTime
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/dtos.AlertSearchQueryResponse'
              type: array
            type: array
      summary: 告警列表
      tags:
      - 告警中心
  /api/v1/alert-plate:
    get:
      parameters:
      - in: query
        name: alertLevel
        type: string
      - in: query
        name: id
        type: string
      - in: query
        name: ids
        type: string
      - in: query
        name: isAll
        type: boolean
      - in: query
        name: likeId
        type: string
      - in: query
        name: name
        type: string
      - in: query
        name: nameLike
        type: string
      - in: query
        name: orderBy
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - in: query
        name: status
        type: string
      - in: query
        name: triggerEndTime
        type: integer
      - in: query
        name: triggerStartTime
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/dtos.AlertSearchQueryResponse'
              type: array
            type: array
      summary: 告警列表
      tags:
      - 告警中心
  /api/v1/alert-rule:
    get:
      parameters:
      - in: query
        name: id
        type: string
      - in: query
        name: ids
        type: string
      - in: query
        name: isAll
        type: boolean
      - in: query
        name: likeId
        type: string
      - in: query
        name: msg
        type: string
      - in: query
        name: name
        type: string
      - in: query
        name: nameLike
        type: string
      - in: query
        name: orderBy
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/dtos.AlertRuleSearchQueryResponse'
              type: array
            type: array
      summary: 告警规则列表
      tags:
      - 告警中心
    post:
      parameters:
      - description: 告警级别
        in: query
        name: alert_level
        type: string
      - description: 告警类型
        in: query
        name: alert_type
        type: string
      - description: 描述
        in: query
        name: description
        type: string
      - description: 名字
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 添加告警规则
      tags:
      - 告警中心
  /api/v1/alert-rule/:ruleId:
    delete:
      parameters:
      - description: ruleId
        in: path
        name: ruleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 告警规则删除
      tags:
      - 告警中心
    get:
      parameters:
      - description: ruleId
        in: path
        name: ruleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 告警规则详情
      tags:
      - 告警中心
    put:
      parameters:
      - description: 执行条件
        in: query
        name: condition
        type: string
      - in: query
        name: id
        type: string
      - description: 静默时间
        in: query
        name: silence_time
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 编辑告警规则
      tags:
      - 告警中心
  /api/v1/alert-rule/:ruleId/restart:
    post:
      parameters:
      - description: ruleId
        in: path
        name: ruleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 告警规则重启
      tags:
      - 告警中心
  /api/v1/alert-rule/:ruleId/start:
    post:
      parameters:
      - description: ruleId
        in: path
        name: ruleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 告警规则启动
      tags:
      - 告警中心
  /api/v1/alert-rule/:ruleId/stop:
    post:
      parameters:
      - description: ruleId
        in: path
        name: ruleId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 告警规则停止
      tags:
      - 告警中心
  /api/v1/alert-treated:
    post:
      produces:
      - application/json
      responses: {}
      summary: 处理告警
      tags:
      - 告警中心
  /api/v1/auth/init-password:
    post:
      parameters:
      - description: 密码初始化参数
        in: body
        name: init_password_request
        required: true
        schema:
          $ref: '#/definitions/dtos.InitPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 密码初始化
      tags:
      - 用户系统
  /api/v1/auth/initInfo:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 获取网关账号是否初始化
      tags:
      - 用户系统
  /api/v1/auth/login:
    post:
      parameters:
      - description: 用户登录参数
        in: body
        name: login_request
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 用户登录
      tags:
      - 用户系统
  /api/v1/auth/password:
    put:
      parameters:
      - description: 密码修改参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphelper.CommonResponse'
      summary: 密码修改
      tags:
      - 用户系统
  /api/v1/category-template:
    get:
      parameters:
      - in: query
        name: categoryName
        type: string
      - in: query
        name: id
        type: string
      - in: query
        name: ids
        type: string
      - in: query
        name: isAll
        type: boolean
      - in: query
        name: likeId
        type: string
      - in: query
        name: name
        type: string
      - in: query
        name: nameLike
        type: string
      - in: query
